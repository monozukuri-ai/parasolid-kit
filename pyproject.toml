[build-system]
requires = ["maturin>=1.11,<2"]
build-backend = "maturin"

[project]
name = "parasolid-kit"
version = "0.1.0.dev0"
description = "Schema-aware Python parser for Parasolid X_T and X_B data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/monozukuri-ai/parasolid-kit"

[project.scripts]
parasolid-kit = "parasolid_kit.cli:main"

[project.optional-dependencies]
occt = [
  "cadquery-ocp-novtk>=7.9.3.1,<7.10",
]
cadquery = [
  "cadquery>=2.8,<2.9",
]

[dependency-groups]
dev = [
  "jsonschema>=4.23,<5",
  "maturin>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.uv]
# uv resolves every optional extra into one universal lock. Limit that
# maintainer lock to the Python range shared by the CadQuery profile; published
# package metadata remains >=3.10 and keeps the CadQuery requirement unmarked.
environments = [
  "python_version >= '3.11'",
]
conflicts = [
  [
    { extra = "occt" },
    { extra = "cadquery" },
  ],
]

[tool.maturin]
manifest-path = "crates/parasolid-python/Cargo.toml"
python-source = "src"
module-name = "parasolid_kit._core"
bindings = "pyo3"
include = [
  "src/parasolid_kit/interop/preview/static/*.html",
  "src/parasolid_kit/interop/preview/static/*.js",
  "src/parasolid_kit/interop/preview/static/*.css",
  { path = "docs/**/*", format = "sdist" },
  { path = "scripts/inspect_xb_headers.py", format = "sdist" },
  { path = "scripts/verify_artifacts.py", format = "sdist" },
  { path = "scripts/verify_corpus.py", format = "sdist" },
  { path = "scripts/verify_isolated_install.py", format = "sdist" },
  { path = "scripts/verify_optional_install.py", format = "sdist" },
  { path = "scripts/verify_optional_interop_i0.py", format = "sdist" },
  { path = "scripts/verify_optional_interop_i3.py", format = "sdist" },
  { path = "scripts/verify_optional_interop_i4.py", format = "sdist" },
  { path = "scripts/verify_optional_interop_i5.py", format = "sdist" },
  { path = "scripts/verify_optional_interop_i6.py", format = "sdist" },
  { path = "scripts/verify_optional_interop_i7.py", format = "sdist" },
  { path = "tests/**/*", format = "sdist" },
  { path = "fuzz/Cargo.toml", format = "sdist" },
  { path = "fuzz/Cargo.lock", format = "sdist" },
  { path = "fuzz/fuzz_targets/**/*", format = "sdist" },
  { path = "corpus/README.md", format = "sdist" },
  { path = "corpus/manifest.schema.json", format = "sdist" },
]
exclude = [
  "**/__pycache__/**",
  "**/*.pyc",
  "data/**",
  "corpus/generated/**",
  "corpus/local/**",
  "corpus/downloads/**",
  "fuzz/artifacts/**",
  "fuzz/corpus/**",
  "fuzz/target/**",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["target"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
