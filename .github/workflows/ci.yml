name: ci

on:
  workflow_call:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: Seconds per sanitizer target
        type: choice
        options: ["600", "1800", "3600"]
        default: "600"
  schedule:
    - cron: "15 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.15"
          enable-cache: true

      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
          components: clippy,rustfmt

      - name: Install Python dependencies
        run: |
          uv python install 3.11
          uv sync --locked --python 3.11

      - name: Verify dependency lock
        run: uv lock --check

      - name: Test Python facade
        run: uv run pytest

      - name: Lint and format Python
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test and lint Rust workspace
        run: |
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo fmt --all --check

      - name: Verify public corpus provenance
        run: uv run python scripts/verify_corpus.py

      - name: Verify required public release cases with Rust and Python
        run: |
          cargo build -p parasolid-core --example release_corpus --locked
          uv run python scripts/verify_release_corpus.py \
            --manifest corpus/manifest.jsonl --checks corpus/release-checks.json \
            --root corpus --rust-probe target/debug/examples/release_corpus

      - name: Verify distributable Rust core
        run: |
          cargo package -p parasolid-core --locked
          cargo test --locked --manifest-path target/package/parasolid-core-*/Cargo.toml

  fuzz-smoke:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Prepare synthetic compiled-profile seeds
        run: python3 scripts/prepare_fuzz_corpus.py

      - name: Run bounded sanitizer smoke
        run: |
          for target in inspect parse schema_catalog; do
            python3 scripts/run_fuzz.py "$target" --runs 100 --seconds 60 \
              --output "fuzz/runs/smoke-$target"
          done

      - name: Retain sanitizer logs and reproducer inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-smoke
          path: fuzz/runs/

  fuzz-long:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        target: [inspect, parse, schema_catalog]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Run bounded sanitizer campaign
        env:
          FUZZ_SECONDS: ${{ inputs.fuzz_seconds || '600' }}
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/run_fuzz.py "$FUZZ_TARGET" --seconds "$FUZZ_SECONDS" \
            --output "fuzz/runs/$FUZZ_TARGET"

      - name: Retain sanitizer logs, corpus and reproducer inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-long-${{ matrix.target }}
          path: fuzz/runs/

  distribution:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.15"
          enable-cache: true

      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0

      - name: Install pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install build dependencies, OCCT tests and cold Python
        run: |
          uv python install 3.10 3.11
          uv sync --locked --extra occt --python 3.11

      - name: Build and test the frontend
        working-directory: viewer
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Verify generated previews, browser controls and both CLI names
        run: |
          mkdir -p viewer/test-results/i6
          uv run --no-sync python scripts/verify_optional_interop_i6.py > viewer/test-results/i6-report.json
          npm --prefix viewer run test:production

      - name: Build wheel and sdist
        run: |
          uv run --no-sync maturin build --release --out dist --compatibility pypi
          uv run --no-sync maturin sdist --out dist

      - name: Verify archive members and metadata
        run: >-
          uv run --no-sync python scripts/verify_artifacts.py
          --wheel dist/*.whl
          --sdist dist/*.tar.gz
          --require-license

      - name: Verify isolated wheel and sdist installs
        run: >-
          uv run --no-sync python scripts/verify_isolated_install.py
          --wheel dist/*.whl
          --sdist dist/*.tar.gz
          --python 3.10

      - name: Verify cold viewer wheel and sdist generation and rendering
        run: >-
          uv run --no-sync python scripts/verify_viewer_install.py
          --wheel dist/*.whl --sdist dist/*.tar.gz --python 3.10
          --output viewer/test-results/distribution

      - name: Retain viewer reports, screenshots and install logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: viewer-validation-linux
          path: viewer/test-results/
          if-no-files-found: error

  optional-profiles:
    name: Optional ${{ matrix.profile }} / Python ${{ matrix.python }} / ${{ matrix.runner }}
    needs: quality
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: occt
            python: "3.10"
            runner: ubuntu-latest
          - profile: cadquery
            python: "3.11"
            runner: ubuntu-latest
          - profile: cadquery
            python: "3.11"
            runner: windows-2025
          - profile: occt
            python: "3.10"
            runner: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.15"
          enable-cache: true

      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0

      - name: Install build dependencies and profile Python
        run: |
          uv python install 3.11 ${{ matrix.python }}
          uv sync --locked --no-install-project --python 3.11

      - name: Build wheel
        run: uv run --no-sync maturin build --release --out dist --compatibility pypi

      - name: Verify optional profile in a cold environment
        shell: python
        run: |
          import glob
          import subprocess
          import sys
          command = [
              "uv", "run", "--no-sync", "python", "scripts/verify_optional_install.py",
              "--wheel", *glob.glob("dist/*.whl"),
              "--profile", "${{ matrix.profile }}", "--python", "${{ matrix.python }}",
          ]
          if sys.platform == "win32" and "${{ matrix.profile }}" == "cadquery":
              command.append("--expect-unsupported-platform")
          subprocess.run(command, check=True)

      - name: Verify CadQuery rejects Python 3.10
        if: matrix.profile == 'cadquery'
        shell: bash
        run: |
          uv python install 3.10
          uv run --no-sync python scripts/verify_optional_install.py \
            --wheel dist/*.whl \
            --profile cadquery \
            --python 3.10 \
            --expect-unsupported-python
