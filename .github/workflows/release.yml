name: release

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Verify candidate source and release receipt
    runs-on: ubuntu-24.04
    outputs:
      candidate_run_id: ${{ steps.verify.outputs.candidate_run_id }}
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify versions and the private verification receipt
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            gh release download "$RELEASE_TAG" --pattern release-verification.json --dir receipt
            python scripts/verify_release.py --tag "$RELEASE_TAG" \
              --receipt receipt/release-verification.json --github-output "$GITHUB_OUTPUT"
          else
            python scripts/verify_release.py --github-output "$GITHUB_OUTPUT"
          fi

  quality:
    if: github.event_name != 'release'
    needs: prepare
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.platform }}
    if: github.event_name != 'release'
    needs: [prepare, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86-64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            artifact: release-linux-x86_64
            include-sdist: true
          - platform: Windows x86-64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            manylinux: auto
            artifact: release-windows-x86_64
            include-sdist: false
          - platform: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            manylinux: auto
            artifact: release-macos-aarch64
            include-sdist: false
          - platform: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: auto
            artifact: release-macos-x86_64
            include-sdist: false
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.15"
          enable-cache: true

      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: Install verification dependencies and cold Python
        run: |
          uv python install 3.10 3.11
          uv sync --locked --no-install-project --python 3.11

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          rust-toolchain: 1.88.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist --compatibility pypi

      - name: Build source distribution for platform verification
        run: uv run --no-sync maturin sdist --out sdist-check

      - name: Verify archive members and metadata
        run: >-
          uv run --no-sync python scripts/verify_artifacts.py
          --wheel dist/*.whl
          --sdist sdist-check/*.tar.gz
          --require-license

      - name: Verify isolated wheel and source installs
        run: >-
          uv run --no-sync python scripts/verify_isolated_install.py
          --wheel dist/*.whl
          --sdist sdist-check/*.tar.gz
          --python 3.10

      - name: Verify OCCT profile
        shell: python
        run: |
          import glob
          import subprocess
          subprocess.run([
              "uv", "run", "--no-sync", "python", "scripts/verify_optional_install.py",
              "--wheel", *glob.glob("dist/*.whl"), "--profile", "occt", "--python", "3.10",
          ], check=True)

      - name: Verify CadQuery runtime or Windows rejection
        shell: python
        run: |
          import glob
          import subprocess
          import sys
          command = [
              "uv", "run", "--no-sync", "python", "scripts/verify_optional_install.py",
              "--wheel", *glob.glob("dist/*.whl"), "--profile", "cadquery", "--python", "3.11",
          ]
          if sys.platform == "win32":
              command.append("--expect-unsupported-platform")
          subprocess.run(command, check=True)

      - name: Verify CadQuery rejects Python 3.10
        run: >-
          uv run --no-sync python scripts/verify_optional_install.py
          --wheel dist/*.whl
          --profile cadquery
          --python 3.10
          --expect-unsupported-python

      - name: Add source distribution to Linux release artifacts
        if: matrix.include-sdist
        run: cp sdist-check/*.tar.gz dist/

      - name: Upload verified artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  core:
    name: Package Rust core
    if: github.event_name != 'release'
    needs: [prepare, quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
      - name: Build and test distributable core
        run: |
          cargo package -p parasolid-core --locked
          cargo test --locked --manifest-path target/package/parasolid-core-*/Cargo.toml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-core
          path: target/package/*.crate
          if-no-files-found: error
          retention-days: 30

  distribution:
    name: Compare all candidate distributions
    if: github.event_name != 'release'
    needs: [build, core]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: candidate
          merge-multiple: true
      - name: Require every platform and identical license bytes
        run: |
          python -c 'from pathlib import Path; from scripts.verify_release import artifact_hashes; print(artifact_hashes(Path("candidate")))'
          for wheel in candidate/*.whl; do
            python scripts/verify_artifacts.py --wheel "$wheel" \
              --sdist candidate/*.tar.gz --require-license
          done

  publish:
    name: Publish privately verified candidate to PyPI
    if: github.event_name == 'release'
    needs: prepare
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/parasolid-kit
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download exact candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ needs.prepare.outputs.candidate_run_id }}
          github-token: ${{ github.token }}
          pattern: release-*
          path: candidate
          merge-multiple: true
      - name: Recheck private receipt, artifact hashes and published core
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$RELEASE_TAG" --pattern release-verification.json --dir receipt
          python scripts/verify_release.py --tag "$RELEASE_TAG" \
            --receipt receipt/release-verification.json --artifacts candidate --require-core-published
          mkdir dist
          cp candidate/*.whl candidate/*.tar.gz dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          print-hash: true
