name: release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Verify release metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          version = project["project"]["version"]
          expected_tag = f"v{version}"
          actual_tag = os.environ["RELEASE_TAG"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"release tag {actual_tag!r} does not match project version; "
                  f"expected {expected_tag!r}"
              )
          print(f"release tag {actual_tag!r} matches project version {version!r}")
          PY

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86-64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            artifact: release-linux-x86_64
            include-sdist: true
          - platform: Windows x86-64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            manylinux: auto
            artifact: release-windows-x86_64
            include-sdist: false
          - platform: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            manylinux: auto
            artifact: release-macos-aarch64
            include-sdist: false
          - platform: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: auto
            artifact: release-macos-x86_64
            include-sdist: false
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.15"
          enable-cache: true

      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: Install verification dependencies and cold Python
        run: |
          uv sync --locked --no-install-project
          uv python install 3.10

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          rust-toolchain: 1.88.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist --compatibility pypi

      - name: Build source distribution for platform verification
        run: uv run --no-sync maturin sdist --out sdist-check

      - name: Verify archive members and metadata
        run: >-
          uv run --no-sync python scripts/verify_artifacts.py
          --wheel dist/*.whl
          --sdist sdist-check/*.tar.gz
          --require-license

      - name: Verify isolated wheel and source installs
        run: >-
          uv run --no-sync python scripts/verify_isolated_install.py
          --wheel dist/*.whl
          --sdist sdist-check/*.tar.gz
          --python 3.10

      - name: Add source distribution to Linux release artifacts
        if: matrix.include-sdist
        run: cp sdist-check/*.tar.gz dist/

      - name: Upload verified artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/parasolid-kit
    permissions:
      id-token: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          print-hash: true
