name: Rust core release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to test and publish
        type: string
        required: true
      dry_run:
        description: Validate the crate without uploading it
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: rust-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}
    steps:
      - name: Check out selected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false
      - name: Verify source versions
        id: verify
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/verify_release.py --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

  quality:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_sha }}

  publish:
    needs: [prepare, quality]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0

      - name: Test Rust core and build the package
        run: |
          cargo package -p parasolid-core --locked
          cargo test --locked --manifest-path target/package/parasolid-core-*/Cargo.toml

      - name: Validate publishing without upload
        if: inputs.dry_run
        run: cargo publish -p parasolid-core --locked --dry-run

      - name: Publish to crates.io
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "CARGO_REGISTRY_TOKEN is not configured" >&2
            exit 1
          fi
          cargo publish -p parasolid-core --locked
