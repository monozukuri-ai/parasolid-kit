name: Rust core release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the crate without uploading it
        type: boolean
        default: true
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: rust-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0

      - name: Verify release tag and Rust version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib
          cargo = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          python = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          version = python["project"]["version"]
          assert os.environ["RELEASE_TAG"] == f"v{version}"
          assert cargo["workspace"]["package"]["version"] == version.replace(".dev", "-dev")
          PY

      - name: Test Rust core and build the package
        run: |
          cargo test -p parasolid-core --locked
          cargo package -p parasolid-core --locked
          cargo test --locked --manifest-path target/package/parasolid-core-*/Cargo.toml

      - name: Validate publishing without upload
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: cargo publish -p parasolid-core --locked --dry-run

      - name: Publish to crates.io
        if: github.event_name == 'release' || !inputs.dry_run
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p parasolid-core --locked
