name: Rust core release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the crate without uploading it
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: rust-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0

      - name: Test Rust core and build the package
        run: |
          cargo test -p parasolid-core --locked
          cargo package -p parasolid-core --locked
          cargo test --locked --manifest-path target/package/parasolid-core-*/Cargo.toml

      - name: Validate publishing without upload
        if: inputs.dry_run
        run: cargo publish -p parasolid-core --locked --dry-run

      - name: Publish to crates.io
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p parasolid-core --locked
