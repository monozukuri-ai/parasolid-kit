name: Rust core release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release containing the private verification receipt
        type: string
        required: true
      dry_run:
        description: Validate the crate without uploading it
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: rust-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Verify exact source and private receipt
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$RELEASE_TAG" --pattern release-verification.json --dir receipt
          python scripts/verify_release.py --tag "$RELEASE_TAG" \
            --receipt receipt/release-verification.json --github-output "$GITHUB_OUTPUT"

      - name: Download verified candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ steps.verify.outputs.candidate_run_id }}
          github-token: ${{ github.token }}
          pattern: release-*
          path: candidate
          merge-multiple: true

      - name: Verify candidate hashes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          python scripts/verify_release.py --tag "$RELEASE_TAG"
          --receipt receipt/release-verification.json --artifacts candidate

      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0

      - name: Test Rust core and build the package
        run: |
          cargo test -p parasolid-core --locked
          cargo package -p parasolid-core --locked
          cargo test --locked --manifest-path target/package/parasolid-core-*/Cargo.toml
          cmp candidate/*.crate target/package/*.crate

      - name: Validate publishing without upload
        if: inputs.dry_run
        run: cargo publish -p parasolid-core --locked --dry-run

      - name: Publish to crates.io
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "CARGO_REGISTRY_TOKEN is not configured" >&2
            exit 1
          fi
          cargo publish -p parasolid-core --locked
