[package]
name = "parasolid-kit-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.88"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
parasolid-core = { path = "../crates/parasolid-core" }

[[bin]]
name = "inspect"
path = "fuzz_targets/inspect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "schema_catalog"
path = "fuzz_targets/schema_catalog.rs"
test = false
doc = false
bench = false

[lints.rust]
unsafe_code = "forbid"
